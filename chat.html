<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant — Osuolale Quyum (koredeve)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #050505;
            --bg-surface: rgba(255, 255, 255, 0.04);
            --bg-surface-hover: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-1: #6366f1;
            --accent-2: #ec4899;
            --accent-3: #14b8a6;
            --glow: rgba(99, 102, 241, 0.2);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #050505;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .chatbot-wrapper {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #08090f;
            border-radius: 0;
            position: relative;
        }

        .chatbot-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), rgba(236, 72, 153, 0.05));
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(12px);
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bot-avatar {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }

        .header-text h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .header-text p {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.25s ease-out forwards;
            max-width: 85%;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.55;
            word-break: break-word;
        }

        .message.bot .message-content {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: #e4e4e7;
            border-bottom-left-radius: 4px;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, var(--accent-1), #4f46e5);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
        }

        .quick-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 4px 0 10px;
        }

        .suggestion-chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .suggestion-chip:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.4);
            color: #fff;
            transform: translateY(-1px);
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 12px 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .success-badge {
            padding: 12px 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            color: #34d399;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            margin: 8px 0;
            animation: slideIn 0.3s ease;
        }

        .input-container {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-surface);
            color: white;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-1);
            background: rgba(99, 102, 241, 0.06);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.15);
        }

        button.send-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            flex-shrink: 0;
        }

        button.send-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        button.send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .messages-container::-webkit-scrollbar {
            width: 5px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="chatbot-wrapper">
        <div class="chatbot-header">
            <div class="header-info">
                <div class="bot-avatar">🤖</div>
                <div class="header-text">
                    <h1>Osuolale's Assistant</h1>
                    <p><span class="status-dot"></span> Online · AI Lead &amp; Project Guide</p>
                </div>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <!-- Initial suggestions will render here -->
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Type your message..."
                    autocomplete="off"
                    onkeypress="if(event.key === 'Enter') sendMessage()"
                />
                <button class="send-btn" onclick="sendMessage()" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://portfolio-chatbot-backend-psi.vercel.app';
        let conversationHistory = [];
        let isConversationComplete = false;

        function addMessage(content, sender) {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerHTML = `<div class="message-content">${content}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function showTyping() {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.id = 'typingIndicator';
            div.className = 'message bot';
            div.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        function sendQuickPrompt(text) {
            const input = document.getElementById('userInput');
            input.value = text;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();

            if (!message || isConversationComplete) return;

            addMessage(message, 'user');
            input.value = '';

            conversationHistory.push({ role: 'user', content: message });
            showTyping();

            try {
                const res = await fetch(`${BACKEND_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        conversationHistory: conversationHistory
                    })
                });

                if (!res.ok) {
                    removeTyping();
                    addMessage("I'm having a brief connection hitch. You can also reach Osuolale directly at <a href='mailto:kelightsub@gmail.com' style='color:#6366f1;text-decoration:underline;'>kelightsub@gmail.com</a>.", 'bot');
                    return;
                }

                const data = await res.json();
                removeTyping();

                if (data && data.message) {
                    addMessage(data.message, 'bot');
                    conversationHistory.push({ role: 'assistant', content: data.message });

                    if (data.isComplete && data.leadData) {
                        isConversationComplete = true;

                        const badge = document.createElement('div');
                        badge.className = 'success-badge';
                        badge.textContent = '✓ Fantastic! Osuolale has received your inquiry and will reach out within 24 hours.';
                        document.getElementById('messagesContainer').appendChild(badge);

                        document.getElementById('userInput').disabled = true;
                        document.getElementById('sendBtn').disabled = true;

                        try {
                            await fetch(`${BACKEND_URL}/api/leads`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    name: data.leadData.name || 'Anonymous',
                                    email: data.leadData.email || '',
                                    projectDescription: data.leadData.project || message,
                                    budget: data.leadData.budget || 'Not specified'
                                })
                            });
                        } catch (err) {
                            console.error('Lead submission note:', err);
                        }
                    }
                } else {
                    addMessage("Thanks for your message! You can also email Osuolale directly at kelightsub@gmail.com.", 'bot');
                }

            } catch (error) {
                removeTyping();
                console.error('Chat error:', error);
                addMessage("I'm temporarily offline. Please drop an email to <a href='mailto:kelightsub@gmail.com' style='color:#6366f1;text-decoration:underline;'>kelightsub@gmail.com</a>!", 'bot');
            }
        }

        window.addEventListener('load', () => {
            addMessage("Hey there! 👋 I'm Osuolale's assistant. What's your name, and how can we collaborate on your next AI or Web3 build?", 'bot');

            const container = document.getElementById('messagesContainer');
            const quickDiv = document.createElement('div');
            quickDiv.className = 'quick-suggestions';
            quickDiv.innerHTML = `
                <button class="suggestion-chip" onclick="sendQuickPrompt('Tell me about your Web3 & GenLayer projects')">⚡ Web3 &amp; GenLayer</button>
                <button class="suggestion-chip" onclick="sendQuickPrompt('What is DeltaPerp Arbitrage Terminal?')">📈 DeltaPerp Terminal</button>
                <button class="suggestion-chip" onclick="sendQuickPrompt('I would like to discuss a project hire')">💼 Discuss a project</button>
            `;
            container.appendChild(quickDiv);
        });
    </script>
</body>
</html>
