    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-void: #060709;
            --bg-base: #090a0e;
            --bg-surface: #0f1118;
            --bg-card: #131622;
            --bg-bubble-bot: #10131f;
            --bg-bubble-user: #181d2e;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(204, 255, 0, 0.4);
            --text-primary: #f5f5f0;
            --text-secondary: #9c9c94;
            --text-muted: #66665f;
            --accent: #ccff00;
            --accent-dim: rgba(204, 255, 0, 0.1);
            --font-display: 'Space Grotesk', -apple-system, sans-serif;
            --font-body: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-void);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .chatbot-wrapper {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            position: relative;
        }

        /* Technical Grid Pattern */
        .chatbot-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }

        /* Header */
        .chatbot-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 17, 24, 0.92);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bot-avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--accent);
            font-weight: 700;
        }

        .header-text h1 {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-tag {
            font-family: var(--font-mono);
            font-size: 9.5px;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid rgba(204, 255, 0, 0.2);
            font-weight: normal;
        }

        .header-text p {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .reset-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 5px 10px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 11px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
        }

        .reset-btn:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 4px;
            transition: color 0.15s, background 0.15s;
        }

        .close-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            z-index: 1;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 82%;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13.5px;
            line-height: 1.6;
            word-break: break-word;
        }

        .message.bot .message-content {
            background: var(--bg-bubble-bot);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-top-left-radius: 2px;
        }

        .message.user .message-content {
            background: var(--bg-bubble-user);
            border: 1px solid rgba(204, 255, 0, 0.25);
            color: #ffffff;
            border-top-right-radius: 2px;
        }

        .message-content p {
            margin-bottom: 8px;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        .message-content ul, .message-content ol {
            margin: 6px 0 6px 18px;
        }

        .message-content li {
            margin-bottom: 4px;
        }

        .message-content a {
            color: var(--accent);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .message-content strong {
            color: #ffffff;
            font-weight: 600;
        }

        .message-time {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            align-self: flex-start;
        }

        .message.user .message-time {
            align-self: flex-end;
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
            background: var(--bg-bubble-bot);
            border: 1px solid var(--border);
            border-radius: 8px;
            border-top-left-radius: 2px;
            width: fit-content;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0.4;
            animation: pulse 1.2s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.15); }
        }

        /* Quick Suggestions */
        .quick-suggestions {
            padding: 8px 16px 12px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            position: relative;
            z-index: 1;
            scrollbar-width: none;
        }

        .quick-suggestions::-webkit-scrollbar {
            display: none;
        }

        .suggestion-chip {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 100px;
            font-family: var(--font-mono);
            font-size: 11.5px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .suggestion-chip:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        /* Input area */
        .input-area {
            padding: 12px 16px 16px;
            border-top: 1px solid var(--border);
            background: rgba(15, 17, 24, 0.95);
            display: flex;
            gap: 10px;
            align-items: flex-end;
            position: relative;
            z-index: 2;
        }

        .input-wrapper {
            flex: 1;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            transition: border-color 0.15s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
        }

        .chat-textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 13.5px;
            line-height: 1.45;
            resize: none;
            max-height: 100px;
            min-height: 22px;
        }

        .chat-textarea::placeholder {
            color: var(--text-muted);
            font-size: 12.5px;
        }

        .send-btn {
            background: var(--accent);
            color: #000000;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.15s, opacity 0.15s;
            height: 38px;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 10px rgba(204, 255, 0, 0.3);
        }

        .send-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        @media (max-width: 600px) {
            .message {
                max-width: 90%;
            }
            .chatbot-header {
                padding: 12px 14px;
            }
            .input-area {
                padding: 10px 12px 12px;
            }
        }
    </style>
</head>

            if (q.includes("forge")) {
                return KNOWLEDGE_BASE.projects.forge;
            }
            if (q.includes("youtube") || q.includes("automation engine")) {
                return KNOWLEDGE_BASE.projects.youtube;
            }
            if (q.includes("mathsolver") || q.includes("math solver") || q.includes("landediq") || q.includes("landed iq") || q.includes("customs")) {
                return KNOWLEDGE_BASE.projects.mathsolver;
            }

            // 2. Broad Projects
            if (q.includes("project") || q.includes("built") || q.includes("portfolio") || q.includes("what has he made") || q.includes("applications") || q.includes("explore projects")) {
                return `<p>Here is a breakdown of verified projects built by Osuolale:</p><ul>` + 
                    KNOWLEDGE_BASE.projects.all.map(item => `<li>${item}</li>`).join('') + 
                    `</ul><p style='margin-top:8px;'>You can ask me for deep dives into any specific project (e.g. <em>"Tell me about WorkProof"</em> or <em>"Explain DeltaPerp"</em>).</p>`;
            }

            // 3. Technical Skills & Stack
            if (q.includes("skill") || q.includes("stack") || q.includes("technolog") || q.includes("language") || q.includes("python") || q.includes("framework") || q.includes("tool")) {
                return `<p>${KNOWLEDGE_BASE.skills.summary}</p><ul>` + 
                    KNOWLEDGE_BASE.skills.categories.map(c => `<li>${c}</li>`).join('') + 
                    `</ul>`;
            }

            // 4. Education & Academic Background
            if (q.includes("education") || q.includes("degree") || q.includes("university") || q.includes("lautech") || q.includes("academic") || q.includes("college") || q.includes("study") || q.includes("studied")) {
                return `<p><strong>Education:</strong> ${KNOWLEDGE_BASE.education.degree}</p>` +
                    `<p><strong>Institution:</strong> ${KNOWLEDGE_BASE.education.institution} (${KNOWLEDGE_BASE.education.period})</p>` +
                    `<p>${KNOWLEDGE_BASE.education.details}</p>`;
            }

            // 5. Experience & Internships
            if (q.includes("experience") || q.includes("background") || q.includes("intern") || q.includes("sqi") || q.includes("work history") || q.includes("career")) {
                return `<p>${KNOWLEDGE_BASE.experience.summary}</p><ul>` + 
                    KNOWLEDGE_BASE.experience.roles.map(r => `<li>${r}</li>`).join('') + 
                    `</ul>`;
            }

            // 6. Contact, Hiring & Collaboration
            if (q.includes("contact") || q.includes("hire") || q.includes("email") || q.includes("collaborat") || q.includes("reach") || q.includes("github") || q.includes("linkedin") || q.includes("cv") || q.includes("resume")) {
                return `<p>${KNOWLEDGE_BASE.contact.summary}</p><ul>` + 
                    KNOWLEDGE_BASE.contact.channels.map(ch => `<li>${ch}</li>`).join('') + 
                    `</ul>`;
            }

            // 7. Developer Identity / Bio
            if (q.includes("who is") || q.includes("about") || q.includes("developer") || q.includes("quyum") || q.includes("koredeve") || q.includes("introduce")) {
                return `<p>${KNOWLEDGE_BASE.developer.summary}</p>` +
                    `<p style='margin-top:8px;'>He graduated with a <strong>B.Sc. in Pure &amp; Applied Mathematics from LAUTECH</strong> (2025, Second Class Upper) and specializes in building reliable AI-driven products with deterministic mathematics.</p>`;
            }

            // 8. Engineering Approach / Philosophy / Uniqueness
            if (q.includes("approach") || q.includes("unique") || q.includes("philosoph") || q.includes("method") || q.includes("rigor") || q.includes("invariant") || q.includes("why hire")) {
                return `<p>${KNOWLEDGE_BASE.approach.summary}</p>`;
            }

            // 9. Polite Greetings
            if (q === "hi" || q === "hello" || q === "hey" || q.startsWith("hello") || q.startsWith("hi ")) {
                return "Hello! I am Osuolale Quyum's portfolio assistant. What would you like to know about his projects, technical capabilities, mathematical background, or how to collaborate with him?";
            }

            // 10. Fallback / Out of Scope Handler
            return `<p>I am specialized in Osuolale Quyum's engineering portfolio, background, and projects.</p>` +
                `<p>I can help you explore:</p>` +
                `<ul>` +
                `<li><strong>Projects:</strong> WorkProof, ImpactVault, DeltaPerp, SignalAI, FORGE, MathSolver</li>` +
                `<li><strong>Skills:</strong> Python, GenLayer Intelligent Contracts, Next.js, LLM Integration</li>` +
                `<li><strong>Background:</strong> LAUTECH Pure Mathematics degree &amp; engineering experience</li>` +
                `<li><strong>Collaboration:</strong> Direct contact channels &amp; CV</li>` +
                `</ul>` +
                `<p>For inquiries outside this scope, feel free to contact him directly at <a href='mailto:kelightsub@gmail.com'>kelightsub@gmail.com</a>.</p>`;
        }

        // =========================================================================
        // UI INTERACTIONS & CHAT LOGIC
        // =========================================================================
        let isProcessing = false;

        function closeChat() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ action: 'closeChat' }, '*');
            } else {
                window.close();
            }
        }

        function formatTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function addMessage(htmlContent, sender = 'bot') {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = htmlContent;

            const timeSpan = document.createElement('span');
            timeSpan.className = 'message-time';
            timeSpan.textContent = formatTime();

            messageDiv.appendChild(contentDiv);
            messageDiv.appendChild(timeSpan);
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function showTyping() {
            const container = document.getElementById('messagesContainer');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="typing-indicator">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>
            `;
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function handleChipClick(chipName) {
            let promptText = chipName;
            if (chipName === 'Explore Projects') promptText = 'What projects has Osuolale built?';
            else if (chipName === 'Technical Skills') promptText = 'What are his technical skills and stack?';
            else if (chipName === 'Education & Experience') promptText = 'Tell me about his education and background';
            else if (chipName === 'Hire / Collaborate') promptText = 'How do I contact or collaborate with him?';

            sendCustomMessage(promptText);
        }

        function sendCustomMessage(text) {
            if (isProcessing) return;
            const input = document.getElementById('userInput');
            input.value = text;
            sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const rawText = input.value;
            const trimmedText = rawText.trim();

            if (!trimmedText || isProcessing) return;

            // Render User Message
            addMessage(escapeHtml(trimmedText), 'user');
            input.value = '';
            input.style.height = 'auto';

            // Set Processing State
            isProcessing = true;
            input.disabled = true;
            sendBtn.disabled = true;
            showTyping();

            // Simulate realistic processing delay for smooth conversational rhythm
            setTimeout(() => {
                removeTyping();
                const responseHtml = processQuery(trimmedText);
                addMessage(responseHtml, 'bot');

                isProcessing = false;
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }, 350);
        }

        function resetConversation() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            isProcessing = false;
            
            const input = document.getElementById('userInput');
            input.disabled = false;
            document.getElementById('sendBtn').disabled = false;

            addMessage("Hi! I'm the portfolio assistant for <strong>Osuolale Quyum</strong> (koredeve). Ask me about his software projects, technical skills, mathematical background, or how to get in touch.", 'bot');
            input.focus();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize on load
        window.addEventListener('load', () => {
            resetConversation();
        });
    </script>
</body>
