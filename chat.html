<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Projects Chat - koredeve</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #050505 0%, #0f0f1e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chatbot-wrapper {
            width: 100%;
            max-width: 600px;
        }

        .chatbot-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            height: 650px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .chatbot-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(236, 72, 153, 0.1));
        }

        .chatbot-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .chatbot-header p {
            font-size: 13px;
            color: #a1a1aa;
            font-weight: 500;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            font-weight: 500;
        }

        .message.bot .message-content {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.25);
            color: #e8e8ff;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
        }

        .typing-indicator {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 12px 16px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 12px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6366f1;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-6px);
            }
        }

        .input-container {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.3);
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
        }

        input[type="text"]::placeholder {
            color: #71717a;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: rgba(99, 102, 241, 0.5);
            background: rgba(99, 102, 241, 0.08);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            flex-shrink: 0;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .success-badge {
            padding: 12px 16px;
            background: rgba(20, 184, 166, 0.1);
            border: 1px solid rgba(20, 184, 166, 0.3);
            border-radius: 8px;
            color: #5eead4;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            margin: 12px 0;
            animation: slideIn 0.3s ease;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .footer-text {
            text-align: center;
            font-size: 11px;
            color: #71717a;
            margin-top: 12px;
        }

        .footer-text a {
            color: #6366f1;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .chatbot-container {
                height: 500px;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chatbot-wrapper">
        <div class="chatbot-container">
            <div class="chatbot-header">
                <h1>💡 Let's Talk AI</h1>
                <p>Tell me about your project and I'll connect you with Osuolale</p>
            </div>

            <div class="messages-container" id="messagesContainer"></div>

            <div class="input-container">
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="userInput"
                        placeholder="Type your message..."
                        autocomplete="off"
                        onkeypress="if(event.key === 'Enter') sendMessage()"
                    />
                    <button onclick="sendMessage()" id="sendBtn">Send</button>
                </div>
            </div>
        </div>

        <div class="footer-text">
            Powered by AI • <a href="https://koredeve.github.io" target="_blank">koredeve.github.io</a>
        </div>
    </div>

    <script>
        // Secure Backend URL - API key hidden server-side
        const BACKEND_URL = 'https://portfolio-chatbot-backend-psi.vercel.app';

        let conversationHistory = [];
        let leadData = { name: null, email: null, projectDescription: null, budget: null };
        let conversationStage = 'greeting';
        let leadCaptured = false;

        function addMessage(content, sender) {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerHTML = `<div class="message-content">${content}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.id = 'typingIndicator';
            div.className = 'message bot';
            div.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
            document.getElementById('messagesContainer').appendChild(div);
            document.getElementById('messagesContainer').scrollTop = document.getElementById('messagesContainer').scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        async function callBackend(userMessage) {
            try {
                const res = await fetch(`${BACKEND_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: userMessage,
                        conversationHistory: conversationHistory
                    })
                });

                if (!res.ok) return "I'm having trouble connecting. Try again?";

                const data = await res.json();
                return data.message || "Sorry, no response.";
            } catch (error) {
                console.error('Error:', error);
                return "Error connecting. Please try again.";
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();

            if (!message || leadCaptured) return;

            addMessage(message, 'user');
            input.value = '';

            conversationHistory.push({ role: 'user', content: message });

            // Extract from user message
            extractLeadInfo(message);
            console.log('After user extraction:', leadData);

            showTyping();
            const botResponse = await callBackend(message);
            removeTyping();

            addMessage(botResponse, 'bot');
            conversationHistory.push({ role: 'assistant', content: botResponse });

            if (conversationHistory.length > 4) conversationStage = 'name';

            // Extract data from bot response too (IMPORTANT - bot mentions email)
            extractLeadInfo(botResponse);
            console.log('After bot extraction:', leadData);

            // Check if bot confirmed the lead (mentioned email or will reach out)
            const isConfirmation = botResponse.includes('reach out') ||
                                  botResponse.includes('will contact') ||
                                  botResponse.includes('get in touch') ||
                                  botResponse.includes('@gmail.com');

            console.log('Bot response includes confirmation indicators:', isConfirmation);
            console.log('Current lead data:', leadData);

            if (isConfirmation) {
                // Give a slight delay for data extraction to finish
                setTimeout(() => {
                    console.log('Checking if ready to capture lead...');
                    console.log('Has name:', !!leadData.name);
                    console.log('Has email:', !!leadData.email);
                    console.log('Has project:', !!leadData.projectDescription);
                    console.log('Has budget:', !!leadData.budget);

                    // If missing name but have email, use email prefix as name
                    if (!leadData.name && leadData.email) {
                        leadData.name = leadData.email.split('@')[0];
                        console.log('Generated name from email:', leadData.name);
                    }

                    // Only need email, project, and budget (name can be generated)
                    if (leadData.email && leadData.projectDescription && leadData.budget) {
                        console.log('✅ SUFFICIENT DATA - Capturing lead:', leadData);
                        captureLead();
                    } else {
                        console.log('❌ INCOMPLETE - Missing:', {
                            name: !leadData.name,
                            email: !leadData.email,
                            project: !leadData.projectDescription,
                            budget: !leadData.budget
                        });
                    }
                }, 200);
            }
        }

        function extractLeadInfo(message) {
            // Extract email (most reliable)
            if (!leadData.email) {
                const emailMatch = message.match(/[^\s@]+@[^\s@]+\.[^\s@]+/);
                if (emailMatch) {
                    leadData.email = emailMatch[0];
                }
            }

            // Extract name (look for capitalized words, but skip common words and pure digits)
            if (!leadData.name && message.length < 100) {
                const words = message.split(/[\s,]+/);
                const potentialName = words.find(word =>
                    word.length > 2 &&
                    word.length < 50 &&
                    word[0] === word[0].toUpperCase() &&
                    !/^\d+$/.test(word) && // Skip pure numbers like "1000"
                    !['The', 'A', 'An', 'For', 'With', 'Build', 'Create', 'He', 'I'].includes(word)
                );
                if (potentialName && !potentialName.includes('.')) {
                    leadData.name = potentialName;
                }
            }

            // Extract project description (anything substantial that's not pure numbers/money)
            if (!leadData.projectDescription && message.length > 10) {
                // Skip if it's just a number (budget), email, or money amounts
                const isJustNumbers = /^[\$\d,.\s–-]+$/.test(message.trim());
                if (!isJustNumbers && !message.includes('@')) {
                    leadData.projectDescription = message.substring(0, 200);
                }
            }

            // Extract budget (look for 3+ digit numbers with optional $ or commas)
            if (!leadData.budget) {
                // Match patterns like 1000, $1000, $1,000, etc - must be 3+ digits
                const budgetMatch = message.match(/\$?[\d]{3,}(?:,\d{3})?(?:\.\d{2})?/);
                if (budgetMatch) {
                    leadData.budget = budgetMatch[0];
                }
            }

            // Log for debugging
            console.log('Lead data so far:', leadData);
        }

        async function captureLead() {
            if (leadCaptured) return; // Don't capture twice
            leadCaptured = true;

            console.log('🎯 CAPTURING LEAD:', leadData);

            try {
                const response = await fetch(`${BACKEND_URL}/api/leads`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(leadData)
                });

                const result = await response.json();
                console.log('✅ Lead sent to backend:', result);
            } catch (error) {
                console.error('❌ Error capturing lead:', error);
            }

            const badge = document.createElement('div');
            badge.className = 'success-badge';
            badge.textContent = '✓ Perfect! Osuolale will be in touch within 24 hours.';
            document.getElementById('messagesContainer').appendChild(badge);
            document.getElementById('userInput').disabled = true;
            document.getElementById('sendBtn').disabled = true;
        }

        window.addEventListener('load', () => {
            addMessage("Hey there! 👋 I'm here to help connect you with Osuolale. What kind of AI project are you thinking about?", 'bot');
        });
    </script>
</body>
</html>
